[project]
name = "oraclemind-ai-py"
version = "0.1.0"
description = "玄镜 OracleMind · AI 解读服务（Python 重构版）"
requires-python = ">=3.11"
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",

    # LangChain + LangGraph
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",

    # RAG 向量数据库
    "chromadb>=0.5.0",

    # 工具库
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",

    # HTTP 异步客户端（report_agent 并行回调排盘服务）
    "aiohttp>=3.9.0",

    # 天文星历（占星模块本命盘实算，纯 Python、离线可用）
    "PyMeeus>=0.5.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Vercel 原生 ASGI 部署入口：Vercel 自动检测 api/index.py 为 Python(ASGI) 函数，
# 并加载其中的 `app` 对象（无需 Mangum）。
# 形态：AI 服务作为独立 Vercel 项目，rootDirectory=oraclemind-ai-py。
# 注意：不要在 [tool.vercel] 手写 entrypoint —— 模块路径解析会失败并报
# "no matching module file was found"，交给 Vercel 自动检测即可。
